<!DOCTYPE html>
<html lang='pt-BR'>

<script type="text/javascript" src="common/header.js"></script>

<body>
  <script type="text/javascript" src="common/menu.js"></script>

  <div class="centered">
    <div class="div-table-row">
      <div class="div-table-col-a">
        <strong>Filtrar por tipo de jogo:</strong>
      </div>
      <div class="div-table-col-b">
        <select id="gameType" class="form-control input-width at-right">
          <option value="">Todos</option>
          <option value="Lotofacil">Lotofácil</option>
          <option value="Mega-Sena">Mega-Sena</option>
          <option value="Quina">Quina</option>
          <option value="Lotomania">Lotomania</option>
          <option value="Quina-Brasil">Quina Brasil</option>
          <option value="Quininha">Quininha</option>
          <option value="Seninha">Seninha</option>
        </select>
      </div>
    </div>

    <div class="buttons" style="margin-top:10px;">
      <button id="btnList" type="button" class="btn btn-primary">Listar</button>
    </div>

    <div id="feedback" class="feedback-msg"></div>
  </div>

  <div id="resultsSection" class="centered" style="display:none; margin-top:20px;">
    <table class="table" style="border-collapse:collapse; min-width:700px;">
      <thead>
        <tr>
          <th>#</th>
          <th>Nome</th>
          <th>Tipo</th>
          <th>Jogos</th>
          <th>Data</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>

  <script type="text/javascript">
    var currentItems = [];
    document.getElementById('btnList').addEventListener('click', loadList);

    function loadList() {
      var gameType = document.getElementById('gameType').value;
      var url = 'http://localhost:3000/combinations';
      if (gameType) url += '?type=' + encodeURIComponent(gameType);

      document.getElementById('feedback').innerText = 'Carregando...';

      $.ajax({
        beforeSend: function (req) {
          req.setRequestHeader('Accept', 'application/json');
        },
        url: url,
        type: 'GET',
        dataType: 'json',
        success: function (data) {
          if (!data || data.length === 0) {
            document.getElementById('feedback').innerText = 'Nenhum jogo encontrado.';
            document.getElementById('resultsSection').style.display = 'none';
            return;
          }
          document.getElementById('feedback').innerText = data.length + ' conjunto(s) encontrado(s).';
          currentItems = data;
          renderTable(currentItems);
        },
        error: function (xhr) {
          document.getElementById('feedback').innerText = friendlyError(xhr, 'Erro ao carregar lista.');
        }
      });
    }

    function renderTable(items) {
      var body = document.getElementById('resultsBody');
      body.innerHTML = '';
      items.forEach(function (item, idx) {
        var date = item.created_on ? new Date(item.created_on).toLocaleString('pt-BR') : '-';
        var numGames = item.numbers && item.numbers.rows ? item.numbers.rows : '-';
        var rowId = 'detail-' + idx;
        var row = document.createElement('tr');
        row.innerHTML =
          '<td>' + (idx + 1) + '</td>' +
          '<td>' + (item.alias || '-') + '</td>' +
          '<td>' + item.game_type + '</td>' +
          '<td>' + numGames + '</td>' +
          '<td>' + date + '</td>' +
          '<td style="white-space:nowrap;">' +
            '<button class="btn btn-default btn-sm" onclick="toggleDetail(\'' + rowId + '\', this)" style="margin-right:4px;">Ver jogos</button>' +
            '<button class="btn btn-danger btn-sm" onclick="deleteItem(\'' + item.id + '\')">Excluir</button>' +
          '</td>';
        body.appendChild(row);

        var detail = document.createElement('tr');
        detail.id = rowId;
        detail.style.display = 'none';
        var combo = (item.numbers && item.numbers.combination) ? item.numbers.combination : [];
        var lines = combo.map(function(game) {
          return game.map(function(n) { return n < 10 ? '0' + n : '' + n; }).join('  ');
        }).join('<br>');
        detail.innerHTML =
          '<td colspan="6" style="background:#f8f9fa; font-family:monospace; padding:8px 16px;">' +
          (lines || '(sem dados)') + '</td>';
        body.appendChild(detail);
      });
      document.getElementById('resultsSection').style.display = '';
    }

    function toggleDetail(rowId, btn) {
      var row = document.getElementById(rowId);
      if (row.style.display === 'none') {
        row.style.display = '';
        btn.innerText = 'Ocultar';
      } else {
        row.style.display = 'none';
        btn.innerText = 'Ver jogos';
      }
    }

    function deleteItem(id) {
      if (!confirm('Excluir este conjunto?')) return;
      $.ajax({
        url: 'http://localhost:3000/combinations/' + encodeURIComponent(id),
        type: 'DELETE',
        success: function () {
          currentItems = currentItems.filter(function (it) { return it.id !== id; });
          if (currentItems.length === 0) {
            document.getElementById('resultsBody').innerHTML = '';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('feedback').innerText = 'Nenhum jogo encontrado.';
            return;
          }
          renderTable(currentItems);
          document.getElementById('feedback').innerText = currentItems.length + ' conjunto(s) encontrado(s).';
        },
        error: function (xhr) {
          alert(friendlyError(xhr, 'Erro ao excluir.'));
        }
      });
    }
  </script>

  <script type="text/javascript" src="common/errors.js"></script>
  <script type="text/javascript" src="common/footer.js"></script>
</body>

</html>
